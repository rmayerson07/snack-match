<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snack Match</title>
<meta name="description" content="A food memory-match game. Flip two cards, find the pairs, learn a food fact with every match.">
<meta name="theme-color" content="#e9f1e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131a15" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snack Match">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/bowlby-one.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Bowlby One"; src: url("fonts/bowlby-one.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Nunito"; src: url("fonts/nunito-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Nunito"; src: url("fonts/nunito-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Nunito"; src: url("fonts/nunito-800.woff2") format("woff2"); font-weight: 800; font-display: swap; }

/* Layout: full-screen app. Landscape = side panel + card board; portrait = panel on top, board, fact strip. Card backs are a picnic-blanket check. */
:root {
  --bg: #e9f1e6;
  --surface: #ffffff;
  --ink: #1d2a21;
  --muted: #5b6d60;
  --line: #cfdccb;
  --tomato: #df4436;
  --tomato-2: #f06a5c;
  --mustard: #f2b632;
  --mustard-shadow: #b8821a;
  --leaf: #2d7a4c;
  --leaf-soft: #d6ecdc;
  --p1: #df4436;
  --p2: #2f6fd0;
  --display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131a15; --surface: #1d261f; --ink: #e8f0e6; --muted: #9fb1a3; --line: #2f3c33;
    --tomato: #d9483b; --tomato-2: #b8372c; --mustard: #f0b93f; --mustard-shadow: #8a6212;
    --leaf: #5cc287; --leaf-soft: #1f3a29; --p1: #f0675a; --p2: #6b9ff0;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none;
  overflow: hidden;
}
.app {
  height: 100%;
  display: grid; gap: 16px;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "panel" "board" "fact";
}
.panel { grid-area: panel; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.board-wrap { grid-area: board; min-height: 0; min-width: 0; position: relative; display: grid; place-items: center; }
.fact { grid-area: fact; }

@media (orientation: landscape) and (min-width: 700px) {
  .app {
    grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas: "panel board" "fact board";
    gap: 20px 24px;
  }
  .panel { overflow-y: auto; }
  .stats { grid-template-columns: 1fr 1fr !important; }
}

.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 {
  font-family: var(--display); font-weight: 400; margin: 0;
  font-size: clamp(2rem, 6vw, 2.9rem); line-height: .95; color: var(--tomato);
}
h1 span { color: var(--leaf); display: inline-block; }
.icon-btn {
  flex: none; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 1.3rem; cursor: pointer;
  display: grid; place-items: center;
}

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button {
  font: 800 1rem var(--body); color: var(--muted); background: none; border: 0;
  min-height: 42px; padding: 0 14px; border-radius: 999px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.btn {
  font: 800 1.05rem var(--body); cursor: pointer; border: 0; border-radius: 999px;
  min-height: 46px; padding: 0 20px; background: var(--mustard); color: #2a1f05;
  box-shadow: 0 3px 0 var(--mustard-shadow);
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--mustard-shadow); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 1.4rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat small { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; }

.players { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.player {
  background: var(--surface); border-radius: 14px; padding: 8px 12px; border: 3px solid transparent;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0;
  transition: border-color .2s, transform .2s;
}
.player input {
  font: 800 1rem var(--body); color: var(--ink); background: none; border: 0; padding: 4px 0;
  width: 100%; min-width: 0; -webkit-user-select: text; user-select: text;
}
.player b { font-family: var(--display); font-weight: 400; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.player.p1 b { color: var(--p1); }
.player.p2 b { color: var(--p2); }
.player.turn.p1 { border-color: var(--p1); transform: translateY(-2px); }
.player.turn.p2 { border-color: var(--p2); transform: translateY(-2px); }
.turn-note { margin: 0; font-weight: 800; color: var(--muted); font-size: .95rem; }

.board { display: grid; gap: var(--gap, 10px); grid-template-columns: repeat(var(--cols, 4), var(--cw, 80px)); }
.card {
  width: var(--cw, 80px); height: calc(var(--cw, 80px) * 4 / 3);
  perspective: 900px; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 16px;
}
.inner { position: relative; width: 100%; height: 100%; transition: transform .45s cubic-bezier(.3,1.4,.5,1); transform-style: preserve-3d; }
.card.up .inner, .card.done .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; }
.back {
  background:
    repeating-linear-gradient(0deg, transparent 0 14px, rgba(255,255,255,.28) 14px 28px),
    repeating-linear-gradient(90deg, var(--tomato) 0 14px, var(--tomato-2) 14px 28px);
  border: 4px solid var(--surface);
  box-shadow: 0 4px 0 var(--line);
}
.back::after {
  content: "?"; font-family: var(--display); font-size: calc(var(--cw, 80px) * .26);
  color: var(--tomato); background: var(--surface); width: 46%; aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center;
}
.front {
  transform: rotateY(180deg); background: var(--surface); border: 4px solid var(--line);
  align-content: center; gap: 4px;
}
.front .emoji { font-size: calc(var(--cw, 80px) * .5); line-height: 1; text-align: center; }
.front .name {
  font-size: max(11px, calc(var(--cw, 80px) * .1)); font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: .05em; text-align: center; padding: 0 4px;
}
.card.done .front { border-color: var(--leaf); background: var(--leaf-soft); }
.card.done .name { color: var(--leaf); }
.card.done.by-p1 .front { border-color: var(--p1); }
.card.done.by-p2 .front { border-color: var(--p2); }
.card.miss .front { border-color: var(--tomato); }
.card.pop .inner { animation: pop .4s ease; }
@keyframes pop { 50% { transform: rotateY(180deg) scale(1.08); } }

.fact {
  background: var(--surface); border-radius: 16px; padding: 14px 16px; min-height: 72px;
  border: 2px dashed var(--line); display: flex; gap: 12px; align-items: center; line-height: 1.4;
}
.fact .big { font-size: 2rem; flex: none; }
.fact p { margin: 0; min-width: 0; }
.fact strong { color: var(--leaf); }

.win-layer {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  z-index: 5;
}
.win {
  background: var(--ink); color: var(--bg); border-radius: 22px; padding: 24px 28px; max-width: 420px; width: 100%;
  display: flex; flex-direction: column; gap: 12px; align-items: flex-start;
  box-shadow: 0 18px 40px rgba(0,0,0,.25);
}
.win h2 { font-family: var(--display); font-weight: 400; margin: 0; font-size: 2.1rem; line-height: 1.05; color: var(--mustard); text-wrap: balance; }
.win p { margin: 0; font-weight: 700; font-size: 1.05rem; }
.stars { font-size: 2.2rem; letter-spacing: 4px; color: var(--mustard); }
.stars .off { opacity: .25; }

@media (prefers-reduced-motion: reduce) {
  .inner { transition: none; }
  .card.pop .inner { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <section class="panel">
    <div class="title-row">
      <h1>Snack <span>Match</span></h1>
      <button class="icon-btn" id="sound" aria-label="Sound on" title="Sound">🔊</button>
    </div>

    <div class="row">
      <div class="seg" role="group" aria-label="Players">
        <button id="mSolo" data-mode="solo" aria-pressed="true">Solo</button>
        <button id="mDuo" data-mode="duo" aria-pressed="false">2 players</button>
      </div>
      <div class="seg" role="group" aria-label="Number of cards">
        <button id="s12" data-n="12" aria-pressed="false">12</button>
        <button id="s16" data-n="16" aria-pressed="true">16</button>
        <button id="s20" data-n="20" aria-pressed="false">20</button>
      </div>
    </div>

    <div class="stats" id="soloStats">
      <div class="stat"><small>Moves</small><b id="moves">0</b></div>
      <div class="stat"><small>Time</small><b id="time">0:00</b></div>
      <div class="stat"><small>Pairs</small><b id="pairs">0/8</b></div>
      <div class="stat"><small>Best</small><b id="best">–</b></div>
    </div>

    <div id="duoStats" hidden>
      <div class="players">
        <label class="player p1" id="pl1"><input id="name1" value="Player 1" maxlength="12" aria-label="Player 1 name" autocomplete="off"><b id="score1">0</b></label>
        <label class="player p2" id="pl2"><input id="name2" value="Player 2" maxlength="12" aria-label="Player 2 name" autocomplete="off"><b id="score2">0</b></label>
      </div>
    </div>
    <p class="turn-note" id="turnNote" hidden></p>

    <div class="row"><button class="btn" id="newGame">New game</button></div>
  </section>

  <section class="board-wrap" id="boardWrap">
    <div id="board" class="board" aria-label="Memory cards"></div>
    <div class="win-layer" id="winLayer" hidden>
      <div class="win" role="dialog" aria-labelledby="winTitle">
        <h2 id="winTitle">All matched!</h2>
        <div class="stars" id="stars"></div>
        <p id="winText"></p>
        <button class="btn" id="again">Play again</button>
      </div>
    </div>
  </section>

  <div class="fact" aria-live="polite" id="fact">
    <span class="big">🍽️</span>
    <p>Each match unlocks a food fact. Fewer moves earns more stars.</p>
  </div>
</div>

<script>
const FOODS = [
  ["🍕","Pizza","The Margherita pizza is said to be named after Queen Margherita of Italy, back in 1889."],
  ["🍣","Sushi","Sushi started as a way to preserve fish by packing it in fermented rice."],
  ["🥑","Avocado","Botanists call an avocado a berry with one big seed."],
  ["🍌","Banana","Bananas count as berries, but strawberries don't."],
  ["🍓","Strawberry","A strawberry wears its seeds on the outside, around 200 of them."],
  ["🌽","Corn","An ear of corn almost always has an even number of rows."],
  ["🍯","Honey","Honey basically never spoils. Archaeologists have found edible honey in ancient Egyptian tombs."],
  ["🥕","Carrot","The first carrots people grew were purple and yellow. Orange came later."],
  ["🍉","Watermelon","A watermelon is about 92% water."],
  ["🍿","Popcorn","Popcorn pops because the water inside each kernel turns to steam and bursts it open."],
  ["🍪","Cookie","The chocolate chip cookie was invented in the 1930s at the Toll House Inn in Massachusetts."],
  ["🥜","Peanut","Peanuts aren't nuts. They're legumes, like beans and peas, and they grow underground."],
  ["🍅","Tomato","Tomatoes are fruits, botanically speaking."],
  ["🌶️","Chili","Chili heat is measured in Scoville units. A bell pepper scores zero."],
  ["🥐","Croissant","The croissant is famous in France, but it grew out of an Austrian roll called the kipferl."],
  ["🍋","Lemon","Lemons have enough acid to power a tiny light bulb if you add metal electrodes."],
  ["🧀","Cheese","There are well over a thousand kinds of cheese around the world."],
  ["🥨","Pretzel","Pretzels have been baked in Europe for well over a thousand years."],
  ["🌮","Taco","Tacos come from Mexico, where corn tortillas have been made for thousands of years."],
  ["🍩","Doughnut","Doughnut holes started as a fix for doughy, undercooked centers."],
  ["🥞","Pancakes","People have been making pancakes since ancient Greek and Roman times."],
  ["🍦","Ice cream","It takes roughly 12 pounds of milk to make one gallon of ice cream."]
];

const $ = id => document.getElementById(id);
const board = $("board"), wrap = $("boardWrap");

function load(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

let size = parseInt(load("sm-size", "16"), 10);
if (![12, 16, 20].includes(size)) size = 16;
let mode = load("sm-mode", "solo") === "duo" ? "duo" : "solo";
let soundOn = load("sm-sound", "1") === "1";
let first = null, lock = false, moves = 0, found = 0, seconds = 0, timer = null, started = false;
let turn = 0, scores = [0, 0];

$("name1").value = load("sm-name1", "Player 1");
$("name2").value = load("sm-name2", "Player 2");
["name1", "name2"].forEach(id => {
  $(id).addEventListener("input", () => { save("sm-" + id, $(id).value); updateTurn(); });
  $(id).addEventListener("keydown", e => { if (e.key === "Enter") $(id).blur(); });
});
const pname = i => ($("name" + (i + 1)).value.trim() || "Player " + (i + 1));

/* ---------- sound ---------- */
let actx = null;
function tone(freq, dur, delay = 0, type = "sine", vol = 0.12) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  flip: () => tone(520, 0.08, 0, "triangle", 0.08),
  match: () => { tone(660, 0.12); tone(880, 0.18, 0.1); },
  miss: () => tone(200, 0.18, 0, "triangle", 0.1),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, i * 0.12))
};
function paintSound() { $("sound").textContent = soundOn ? "🔊" : "🔇"; $("sound").setAttribute("aria-label", soundOn ? "Sound on" : "Sound off"); }
$("sound").addEventListener("click", () => { soundOn = !soundOn; save("sm-sound", soundOn ? "1" : "0"); paintSound(); sfx.flip(); });

/* ---------- layout: fit cards to the screen ---------- */
function grid() {
  const r = wrap.getBoundingClientRect();
  const land = r.width > r.height;
  const opts = { 12: [[4, 3], [3, 4], [6, 2]], 16: [[4, 4], [8, 2], [2, 8]], 20: [[5, 4], [4, 5], [10, 2]] }[size];
  let best = null;
  for (const [c, rws] of opts) {
    const gap = Math.max(6, Math.min(14, r.width / 70));
    const wByW = (r.width - gap * (c - 1)) / c;
    const wByH = ((r.height - gap * (rws - 1)) / rws) * 0.75;
    const cw = Math.floor(Math.min(wByW, wByH));
    if (!best || cw > best.cw) best = { c, cw, gap };
  }
  board.style.setProperty("--cols", best.c);
  board.style.setProperty("--cw", Math.max(40, best.cw) + "px");
  board.style.setProperty("--gap", best.gap + "px");
}
new ResizeObserver(grid).observe(wrap);
window.addEventListener("orientationchange", () => setTimeout(grid, 200));

/* ---------- game ---------- */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmt(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function bestKey() { return "snack-best-" + size; }

function updateStats() {
  $("moves").textContent = moves;
  $("pairs").textContent = found + "/" + size / 2;
  $("time").textContent = fmt(seconds);
  $("score1").textContent = scores[0];
  $("score2").textContent = scores[1];
}
function updateTurn() {
  const duo = mode === "duo";
  $("soloStats").hidden = duo;
  $("duoStats").hidden = !duo;
  $("turnNote").hidden = !duo;
  $("pl1").classList.toggle("turn", duo && turn === 0);
  $("pl2").classList.toggle("turn", duo && turn === 1);
  if (duo) $("turnNote").textContent = pname(turn) + "'s turn. Match a pair to go again.";
}
function paintSegs() {
  document.querySelectorAll("[data-n]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.n === size));
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
}

function newGame() {
  clearInterval(timer); timer = null; started = false;
  first = null; lock = false; moves = 0; found = 0; seconds = 0; turn = 0; scores = [0, 0];
  $("winLayer").hidden = true;
  const picks = shuffle(FOODS.slice()).slice(0, size / 2);
  const deck = shuffle(picks.concat(picks));
  board.innerHTML = "";
  deck.forEach((f, idx) => {
    const b = document.createElement("button");
    b.className = "card"; b.id = "card" + idx; b.dataset.food = f[1];
    b.setAttribute("aria-label", "Hidden card");
    b.innerHTML = `<div class="inner"><div class="face back"></div><div class="face front"><span class="emoji">${f[0]}</span><span class="name">${f[1]}</span></div></div>`;
    b.addEventListener("click", () => flip(b, f));
    board.appendChild(b);
  });
  $("fact").innerHTML = `<span class="big">🍽️</span><p>${mode === "duo" ? "Take turns flipping two cards. Most pairs wins." : "Each match unlocks a food fact. Fewer moves earns more stars."}</p>`;
  const b = load(bestKey(), null); $("best").textContent = b ? b : "–";
  paintSegs(); updateStats(); updateTurn(); grid();
}

function flip(card, f) {
  if (lock || card.classList.contains("up") || card.classList.contains("done")) return;
  if (document.activeElement && document.activeElement.tagName === "INPUT") document.activeElement.blur();
  if (!started) { started = true; timer = setInterval(() => { seconds++; updateStats(); }, 1000); }
  sfx.flip();
  card.classList.add("up");
  card.setAttribute("aria-label", f[1]);
  if (!first) { first = { card, f }; return; }
  moves++;
  const a = first.card, b = card;
  first = null;
  if (a.dataset.food === b.dataset.food) {
    const cls = mode === "duo" ? "by-p" + (turn + 1) : null;
    [a, b].forEach(c => { c.classList.remove("up"); c.classList.add("done", "pop"); if (cls) c.classList.add(cls); c.setAttribute("aria-label", f[1] + ", matched"); });
    found++;
    if (mode === "duo") scores[turn]++;
    setTimeout(sfx.match, 120);
    $("fact").innerHTML = `<span class="big">${f[0]}</span><p><strong>${f[1]}:</strong> ${f[2]}</p>`;
    updateStats(); updateTurn();
    if (found === size / 2) setTimeout(win, 500);
  } else {
    lock = true;
    [a, b].forEach(c => c.classList.add("miss"));
    setTimeout(sfx.miss, 250);
    updateStats();
    setTimeout(() => {
      [a, b].forEach(c => { c.classList.remove("up", "miss"); c.setAttribute("aria-label", "Hidden card"); });
      if (mode === "duo") { turn = 1 - turn; updateTurn(); }
      lock = false;
    }, 900);
  }
}

function win() {
  clearInterval(timer);
  sfx.win();
  if (mode === "duo") {
    $("stars").innerHTML = "";
    const [s1, s2] = scores;
    $("winTitle").textContent = s1 === s2 ? "It's a tie!" : pname(s1 > s2 ? 0 : 1) + " wins!";
    $("winText").textContent = `${pname(0)} ${s1}, ${pname(1)} ${s2}. ${moves} moves in ${fmt(seconds)}.`;
  } else {
    const pairs = size / 2;
    const stars = moves <= pairs * 1.5 ? 3 : moves <= pairs * 2.2 ? 2 : 1;
    $("winTitle").textContent = "All matched!";
    $("stars").innerHTML = "★".repeat(stars) + `<span class="off">${"★".repeat(3 - stars)}</span>`;
    const prev = parseInt(load(bestKey(), "0"), 10);
    let line = `${moves} moves in ${fmt(seconds)}.`;
    if (!prev || moves < prev) { save(bestKey(), String(moves)); line += prev ? ` New best! Old record was ${prev}.` : " That's your first record."; }
    else line += ` Your best is ${prev} moves.`;
    $("winText").textContent = line;
    $("best").textContent = load(bestKey(), "–");
  }
  $("winLayer").hidden = false;
}

document.querySelectorAll("[data-n]").forEach(btn => btn.addEventListener("click", () => { size = +btn.dataset.n; save("sm-size", size); newGame(); }));
document.querySelectorAll("[data-mode]").forEach(btn => btn.addEventListener("click", () => { mode = btn.dataset.mode; save("sm-mode", mode); newGame(); }));
$("newGame").addEventListener("click", newGame);
$("again").addEventListener("click", newGame);
document.addEventListener("gesturestart", e => e.preventDefault());

paintSound();
newGame();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
